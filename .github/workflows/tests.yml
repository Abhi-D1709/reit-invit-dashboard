# Unit tests on every push and pull request. The page smoke test needs the network (Google Sheets,
# the data branch), so it is a separate, non-blocking job.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  smoke:
    # Loads every page against live data. Non-blocking: a Google/GitHub hiccup must not turn CI red,
    # but a real crash (e.g. a dependency upgrade removing an API) shows up here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      RUN_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q tests/test_pages_smoke.py
